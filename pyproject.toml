[project]
name = "rag-work"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.13.0",
    "ipykernel>=6.31.0",
    "langchain>=0.3.30",
    "langchain-community>=0.3.31",
    "langchain-core>=0.3.86",
    "pymupdf>=1.26.5",
    "pypdf>=6.19.0",
    "sentence-transformers>=5.1.2",
]

[project.scripts]
rag-work = "rag_work:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
